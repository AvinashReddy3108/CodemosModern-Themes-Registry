[project]
name = "codemosmodern-themes-registrar"
version = "0.1.0"
description = "Fetches themes from 'vscodethemes.com' and constructs the theme registry for use in Codemos Modern"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "commentjson>=0.9.0",
  "hishel[async]>=1.2.1",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "pathvalidate>=3.3.1",
  "tenacity>=9.1.4",
  "typer>=0.25.1",
]

[project.scripts]
registrar = "registrar.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.15.12",
  "ty>=0.0.34",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
